<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reprise Electrical — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..500&family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REPRISE ELECTRICAL — IN-HOUSE CRM
   Design language carried from the Electrical Health Report
   ============================================================ */
:root{
  --ink:#14140f; --ink-2:#1c1c16; --ink-3:#26261e;
  --paper:#f3f1ea; --paper-2:#e9e6db; --paper-3:#ddd9cb;
  --brass:#b08a4a; --brass-lt:#cba968; --brass-dk:#8a6c39;
  --line:#d5d0c0; --line-ink:#34332a;
  --text:#25251f; --text-mut:#71706a; --text-faint:#9c9a8e;
  --green:#5f7355; --amber:#b0883e; --rust:#a8512f;
  --serif:'Lora',Georgia,serif;
  --sans:'Poppins',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--sans);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:var(--sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--ink-2);}
::-webkit-scrollbar-thumb{background:var(--line-ink);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--brass-dk);}

/* ---------- shared atoms ---------- */
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:0.28em;text-transform:uppercase;}
.mono{font-family:var(--mono);}
.serif{font-family:var(--serif);}

/* ============================================================
   LOGIN SCREEN
   ============================================================ */
#login{
  position:fixed;inset:0;z-index:500;
  background:var(--ink);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;padding:30px;
}
.login-grain{
  position:absolute;inset:0;opacity:0.5;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,0.04) 2px 3px);
}
.login-card{position:relative;z-index:2;width:100%;max-width:440px;text-align:center;}
.login-glyph{width:46px;height:46px;margin:0 auto 26px;}
.login-mark{
  font-family:var(--sans);font-weight:500;font-size:13px;
  letter-spacing:0.26em;color:var(--paper);margin-bottom:8px;
}
.login-sub{
  font-family:var(--mono);font-size:10px;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--text-faint);margin-bottom:46px;
}
.login-q{
  font-family:var(--serif);font-size:25px;color:var(--paper);
  margin-bottom:30px;font-weight:400;
}
.login-q em{color:var(--brass-lt);font-style:italic;}
.user-pick{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.user-btn{
  width:170px;padding:30px 18px;
  background:var(--ink-2);border:1px solid var(--line-ink);
  border-radius:3px;transition:all 0.3s var(--ease);
}
.user-btn:hover{border-color:var(--brass);background:var(--ink-3);transform:translateY(-3px);}
.user-avatar{
  width:54px;height:54px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;color:var(--ink);
  background:linear-gradient(135deg,var(--brass-lt),var(--brass-dk));
}
.user-name{font-size:15px;color:var(--paper);font-weight:500;margin-bottom:3px;}
.user-role{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--text-faint);}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:none;height:100vh;}
.app-grid{display:grid;grid-template-columns:230px 1fr;height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:var(--ink);border-right:1px solid var(--line-ink);
  display:flex;flex-direction:column;overflow-y:auto;
}
.sb-brand{
  display:flex;align-items:center;gap:11px;
  padding:24px 22px;border-bottom:1px solid var(--line-ink);
}
.sb-glyph{width:28px;height:28px;flex-shrink:0;}
.sb-name{
  font-family:var(--sans);font-weight:500;font-size:11px;
  letter-spacing:0.2em;color:var(--paper);line-height:1.5;
}
.sb-section{
  font-family:var(--mono);font-size:9px;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--text-faint);
  padding:22px 22px 9px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 22px;font-size:13px;color:var(--paper-3);
  transition:all 0.2s var(--ease);text-align:left;
  border-left:2px solid transparent;
}
.nav-item:hover{background:var(--ink-2);color:var(--paper);}
.nav-item.active{
  background:var(--ink-2);color:var(--brass-lt);
  border-left-color:var(--brass);
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-count{
  margin-left:auto;font-family:var(--mono);font-size:10px;
  background:var(--ink-3);padding:2px 7px;border-radius:9px;
  color:var(--text-faint);
}
.nav-item.active .nav-count{background:var(--brass-dk);color:var(--paper);}
.sb-foot{
  margin-top:auto;padding:18px 22px;border-top:1px solid var(--line-ink);
  display:flex;align-items:center;gap:10px;
}
.sb-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;color:var(--ink);
  background:linear-gradient(135deg,var(--brass-lt),var(--brass-dk));
}
.sb-user-info{flex:1;min-width:0;}
.sb-user-name{font-size:12px;color:var(--paper);font-weight:500;}
.sb-user-role{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--text-faint);}
.sb-logout{
  font-family:var(--mono);font-size:9px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--text-faint);
  padding:5px 8px;border:1px solid var(--line-ink);border-radius:2px;
  transition:all 0.2s var(--ease);
}
.sb-logout:hover{border-color:var(--rust);color:var(--rust);}

/* ---------- MAIN PANEL ---------- */
.main{background:var(--paper);overflow-y:auto;position:relative;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:20px 38px;display:flex;align-items:center;
  justify-content:space-between;gap:20px;
}
.topbar-l .tb-kicker{
  font-family:var(--mono);font-size:9px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;
}
.topbar-l h1{
  font-family:var(--serif);font-size:25px;font-weight:500;color:var(--ink);
}
.topbar-r{display:flex;gap:11px;align-items:center;}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--paper-2);border:1px solid var(--line);
  border-radius:3px;padding:8px 13px;width:230px;
}
.search-box svg{width:14px;height:14px;color:var(--text-faint);flex-shrink:0;}
.search-box input{
  border:none;background:none;outline:none;width:100%;
  font-size:13px;color:var(--text);
}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:3px;font-size:12px;font-weight:500;
  letter-spacing:0.02em;transition:all 0.2s var(--ease);
  border:1px solid transparent;white-space:nowrap;
}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{background:var(--ink-3);}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text);}
.btn-ghost:hover{border-color:var(--brass);color:var(--brass-dk);}
.btn-brass{background:var(--brass);color:var(--ink);}
.btn-brass:hover{background:var(--brass-lt);}
.btn-sm{padding:6px 11px;font-size:11px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.page{padding:32px 38px 70px;display:none;}
.page.active{display:block;}

/* ---------- DASHBOARD ---------- */
.stat-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;
}
.stat-card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:20px;position:relative;overflow:hidden;
}
.stat-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--brass);
}
.stat-card.green::before{background:var(--green);}
.stat-card.amber::before{background:var(--amber);}
.stat-card.rust::before{background:var(--rust);}
.stat-k{
  font-family:var(--mono);font-size:9px;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--text-faint);margin-bottom:11px;
}
.stat-v{font-family:var(--serif);font-size:38px;color:var(--ink);line-height:1;}
.stat-meta{font-size:11px;color:var(--text-mut);margin-top:7px;}
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px;}
.panel{
  background:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:22px;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.panel-title{
  font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:500;
}
.panel-tag{
  font-family:var(--mono);font-size:9px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--text-faint);
}
/* bar chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;}
.chart-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;}
.chart-bar{
  width:42%;background:var(--brass);border-radius:2px 2px 0 0;
  min-height:2px;transition:height 0.8s var(--ease);position:relative;
}
.chart-bar.fu{background:var(--ink-3);}
.chart-bar:hover{opacity:0.8;}
.chart-bar .bv{
  position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;color:var(--text-mut);
}
.chart-x{
  font-family:var(--mono);font-size:9px;letter-spacing:0.05em;
  color:var(--text-faint);text-transform:uppercase;
}
.chart-legend{display:flex;gap:18px;margin-top:14px;justify-content:center;}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mut);}
.leg-swatch{width:11px;height:11px;border-radius:2px;}
/* win/loss donut */
.donut-wrap{display:flex;align-items:center;gap:24px;}
.donut{position:relative;width:140px;height:140px;flex-shrink:0;}
.donut svg{transform:rotate(-90deg);}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.donut-pct{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1;}
.donut-lbl{font-family:var(--mono);font-size:8px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--text-faint);margin-top:3px;}
.wl-rows{flex:1;display:flex;flex-direction:column;gap:13px;}
.wl-row{display:flex;align-items:center;gap:10px;}
.wl-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.wl-name{font-size:12px;color:var(--text);flex:1;}
.wl-val{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:500;}

/* industry breakdown bars */
.ind-list{display:flex;flex-direction:column;gap:13px;}
.ind-item{display:flex;align-items:center;gap:12px;}
.ind-name{font-size:12px;color:var(--text);width:84px;flex-shrink:0;}
.ind-track{flex:1;height:8px;background:var(--paper-3);border-radius:4px;overflow:hidden;}
.ind-fill{height:100%;background:var(--brass);border-radius:4px;transition:width 0.8s var(--ease);}
.ind-val{font-family:var(--mono);font-size:11px;color:var(--text-mut);width:24px;text-align:right;}

/* reminders */
.reminder-list{display:flex;flex-direction:column;gap:9px;}
.reminder{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--paper-2);border:1px solid var(--line);border-radius:3px;
  border-left:3px solid var(--amber);
}
.reminder.due{border-left-color:var(--rust);}
.reminder.upcoming{border-left-color:var(--brass);}
.rem-icon{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--brass-lt);
}
.rem-icon svg{width:15px;height:15px;}
.rem-body{flex:1;min-width:0;}
.rem-title{font-size:12px;color:var(--ink);font-weight:500;}
.rem-meta{font-size:11px;color:var(--text-mut);margin-top:2px;}
.rem-due{
  font-family:var(--mono);font-size:9px;letter-spacing:0.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:9px;
  background:var(--rust);color:var(--paper);white-space:nowrap;
}
.rem-due.soon{background:var(--amber);}
.rem-due.later{background:var(--paper-3);color:var(--text-mut);}
.empty-mini{
  text-align:center;padding:26px 12px;color:var(--text-faint);
  font-size:12px;
}

/* ---------- COMPANIES / CATEGORY ---------- */
.cat-bar{
  display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;
}
.cat-chip{
  display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:20px;font-size:12px;
  border:1px solid var(--line);background:var(--paper);
  color:var(--text-mut);transition:all 0.2s var(--ease);
}
.cat-chip:hover{border-color:var(--brass);color:var(--brass-dk);}
.cat-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat-chip .cc-count{
  font-family:var(--mono);font-size:10px;
  background:var(--paper-3);color:var(--text-mut);
  padding:1px 6px;border-radius:8px;
}
.cat-chip.active .cc-count{background:var(--brass-dk);color:var(--paper);}

.company-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;
}
.company-card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:20px;cursor:pointer;
  transition:all 0.22s var(--ease);position:relative;
}
.company-card:hover{
  border-color:var(--brass);transform:translateY(-3px);
  box-shadow:0 14px 30px -18px rgba(20,20,15,0.4);
}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.cc-name{font-family:var(--serif);font-size:17px;color:var(--ink);font-weight:500;line-height:1.3;}
.cc-industry{
  font-family:var(--mono);font-size:8px;letter-spacing:0.12em;
  text-transform:uppercase;padding:4px 8px;border-radius:3px;
  background:var(--ink);color:var(--brass-lt);white-space:nowrap;flex-shrink:0;
}
.cc-detail{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mut);margin-bottom:7px;}
.cc-detail svg{width:13px;height:13px;flex-shrink:0;color:var(--text-faint);}
.cc-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:15px;padding-top:14px;border-top:1px solid var(--line);
}
.cc-status{display:flex;align-items:center;gap:6px;font-size:11px;}
.status-dot{width:8px;height:8px;border-radius:50%;}
.cc-contacts{font-family:var(--mono);font-size:10px;color:var(--text-faint);}

.stage-tag{
  font-family:var(--mono);font-size:8px;letter-spacing:0.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:9px;
}

/* ---------- DETAIL VIEW ---------- */
.detail-back{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--text-mut);margin-bottom:18px;
  transition:color 0.2s;
}
.detail-back:hover{color:var(--brass-dk);}
.detail-back svg{width:13px;height:13px;}
.detail-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;margin-bottom:8px;flex-wrap:wrap;
}
.detail-title{font-family:var(--serif);font-size:30px;color:var(--ink);font-weight:500;}
.detail-sub{display:flex;gap:14px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.detail-sub a{color:var(--brass-dk);font-size:12px;text-decoration:none;}
.detail-sub a:hover{text-decoration:underline;}
.detail-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field.full{grid-column:1/-1;}
.field-label{
  font-family:var(--mono);font-size:9px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--text-faint);
}
.field-value{font-size:13px;color:var(--text);line-height:1.5;}
.field-value.muted{color:var(--text-faint);font-style:italic;}

.contact-card{
  background:var(--paper-2);border:1px solid var(--line);
  border-radius:3px;padding:15px;margin-bottom:11px;
}
.contact-top{display:flex;justify-content:space-between;align-items:flex-start;}
.contact-name{font-size:14px;color:var(--ink);font-weight:500;}
.contact-pos{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--brass-dk);margin-top:2px;}
.contact-lines{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.contact-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mut);}
.contact-line svg{width:12px;height:12px;color:var(--text-faint);flex-shrink:0;}

/* email action buttons */
.email-actions{display:flex;flex-direction:column;gap:9px;}
.email-btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px;border-radius:3px;border:1px solid var(--line-ink);
  background:var(--ink);color:var(--paper);transition:all 0.2s var(--ease);
}
.email-btn:hover:not(:disabled){background:var(--ink-3);border-color:var(--brass);}
.email-btn:disabled{opacity:0.45;cursor:not-allowed;}
.eb-num{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;
  background:var(--brass-dk);color:var(--paper);
}
.eb-body{flex:1;}
.eb-title{font-size:13px;font-weight:500;}
.eb-meta{font-family:var(--mono);font-size:9px;letter-spacing:0.06em;
  color:var(--text-faint);margin-top:2px;}
.eb-check{color:var(--green);}
.eb-check svg{width:16px;height:16px;}

.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.tl-item:not(:last-child)::before{
  content:"";position:absolute;left:13px;top:28px;bottom:0;
  width:1px;background:var(--line);
}
.tl-dot{
  width:27px;height:27px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--brass-lt);z-index:1;
}
.tl-dot svg{width:13px;height:13px;}
.tl-body{flex:1;padding-top:3px;}
.tl-title{font-size:12px;color:var(--ink);font-weight:500;}
.tl-meta{font-family:var(--mono);font-size:9px;letter-spacing:0.05em;
  color:var(--text-faint);margin-top:2px;}

/* ---------- MODAL ---------- */
.modal-veil{
  position:fixed;inset:0;z-index:200;
  background:rgba(20,20,15,0.7);
  display:none;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;
}
.modal-veil.open{display:flex;}
.modal{
  background:var(--paper);border-radius:4px;
  width:100%;max-width:680px;
  border:1px solid var(--line-ink);
  animation:modalIn 0.3s var(--ease);
}
.modal.wide{max-width:820px;}
@keyframes modalIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 26px;border-bottom:1px solid var(--line);
}

/* ---- build a finished email ---- */
function buildEmail(industry, stage, ctx){
  /* ctx: { sender:'chris'|'adrian', contactName, companyName } */
  var sender = SENDERS[ctx.sender] || SENDERS.chris;
  var ind = BODIES[industry] ? industry : 'Office'; /* safe fallback */
  var tpl = BODIES[ind][stage];
  if(!tpl) throw new Error('No template for '+industry+'/'+stage);

  var contact = ctx.contactName || 'there';
  var company = ctx.companyName || 'your business';
  var firstName = String(contact).trim().split(/\s+/)[0] || 'there';

  function fill(s){
    return s.replace(/\{SENDER\}/g, esc(sender.name))
            .replace(/\{C\}/g, esc(firstName))
            .replace(/\{CO\}/g, esc(company));
  }

  var bodyHTML = tpl.paras.map(function(p,i){
    var first = (i===0);
    var size = first? '22px':'14px';
    var famly = first? "'Cormorant Garamond',Georgia,serif":'Helvetica,Arial,sans-serif';
    var color = first? '#222':'#444';
    var last = (i===tpl.paras.length-1);
    var mb = last? '44px':'24px';
    return '<p style="margin:0 0 '+mb+' 0;font-family:'+famly+';font-size:'+size+
      ';font-weight:300;line-height:'+(first?'34px':'26px')+';color:'+color+';">'+
      fill(p)+'</p>';
  }).join('');

  var html = shell()
    .replace(/\{\{DATE\}\}/g, esc(monthYear()))
    .replace(/\{\{HEAD\}\}/g, fill(tpl.head))
    .replace(/\{\{BODY\}\}/g, bodyHTML)
    .replace(/\{\{QUOTE\}\}/g, fill(tpl.quote))
    .replace(/\{\{SIG_NAME\}\}/g, esc(sender.name))
    .replace(/\{\{SIG_TITLE\}\}/g, esc(sender.title))
    .replace(/\{\{SIG_EMAIL\}\}/g, esc(sender.email))
    .replace(/\{\{SIG_PHONE\}\}/g, esc(sender.phone))
    .replace(/\{\{SIG_PHONE_D\}\}/g, esc(sender.phoneDisplay))
    .replace(/\{\{CO_ENC\}\}/g, encodeURIComponent(company));

  var subject = SUBJECTS[stage].replace(/\{CO\}/g, company);

  return { subject: subject, html: html, fromEmail: sender.email,
           fromName: 'Reprise Electrical', replyTo: sender.email };
}

function monthYear(){
  var d = new Date();
  return d.toLocaleDateString('en-AU',{month:'long',year:'numeric'});
}

return { buildEmail: buildEmail, SENDERS: SENDERS, BODIES: BODIES };

/* ============================================================
   STORAGE — SHARED GOOGLE SHEET (with local fallback)
   ------------------------------------------------------------
   The CRM syncs to ONE Google Sheet so Chris & Adrian see the
   same live list. The connection link is pasted once in Settings.
   If no link is set, it falls back to this-device-only storage
   so the app still works while you set things up.
   ============================================================ */
var STORE_KEY     = 'reprise_crm_v1';   /* local fallback data */
var LINK_KEY      = 'reprise_crm_link'; /* the saved Sheet web-app URL */
var storageOK     = true;
var syncURL       = '';     /* Google Apps Script web-app URL */
var syncMode      = 'local';/* 'sheet' | 'local' */
var lastSyncAt    = null;
var saveTimer     = null;

/* ---- durable key/value: localStorage first, window.storage as backup ----
   localStorage is the most reliable store once the CRM runs from a real
   web address, and it also survives in more situations generally. */
function lsGet(key){
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
function lsSet(key,val){
  try{ window.localStorage.setItem(key,val); return true; }catch(e){ return false; }
}
function lsDel(key){
  try{ window.localStorage.removeItem(key); }catch(e){}
}

/* read the saved connection link from this device */
async function loadSyncLink(){
  /* 1. localStorage (primary) */
  var local = lsGet(LINK_KEY);
  if(local){ syncURL = local; return; }
  /* 2. window.storage (backup, e.g. data saved by an older version) */
  try{
    var r = await window.storage.get(LINK_KEY, false);
    if(r && r.value){
      syncURL = r.value;
      lsSet(LINK_KEY, syncURL); /* migrate it forward */
    }
  }catch(e){ /* none saved yet */ }
}
async function saveSyncLink(url){
  syncURL = (url||'').trim();
  if(syncURL){
    lsSet(LINK_KEY, syncURL);
    try{ await window.storage.set(LINK_KEY, syncURL, false); }catch(e){}
  } else {
    lsDel(LINK_KEY);
    try{ await window.storage.set(LINK_KEY, '', false); }catch(e){}
  }
}

/* bundle current data for transport */
function packData(){
  return {
    companies:state.companies,
    emails:state.emails,
    signatures:state.signatures,
    templates:state.templates
  };
}
function applyData(d){
  if(!d) return;
  state.companies  = d.companies  || [];
  state.emails     = d.emails     || [];
  state.signatures = d.signatures || JSON.parse(JSON.stringify(DEFAULT_SIGNATURES));
  state.templates  = d.templates  || JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
}

/* ---- local fallback (this device only) ---- */
async function loadLocal(){
  /* 1. localStorage (primary, most durable) */
  var local = lsGet(STORE_KEY);
  if(local){
    try{ applyData(JSON.parse(local)); return; }catch(e){}
  }
  /* 2. window.storage (backup / migration from older version) */
  try{
    var res = await window.storage.get(STORE_KEY, true);
    if(res && res.value){
      applyData(JSON.parse(res.value));
      lsSet(STORE_KEY, res.value); /* migrate forward */
    }
  }catch(e){ console.log('No local data, fresh start.'); }
}
async function saveLocal(){
  var payload = JSON.stringify(packData());
  lsSet(STORE_KEY, payload);
  try{
    await window.storage.set(STORE_KEY, payload, true);
  }catch(e){ console.error('Backup save failed',e); }
}

/* ---- shared Google Sheet ---- */
/* GET returns the whole dataset; POST overwrites it. */
async function loadFromSheet(){
  var res = await fetch(syncURL,{method:'GET'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  var json = await res.json();
  if(json && json.ok){
    applyData(json.data||{});
    lastSyncAt = Date.now();
    return true;
  }
  throw new Error(json && json.error ? json.error : 'Bad response');
}
async function saveToSheet(){
  /* text/plain avoids a CORS preflight against Apps Script */
  var res = await fetch(syncURL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(packData())
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  var json = await res.json();
  if(!(json && json.ok)) throw new Error(json && json.error ? json.error : 'Save rejected');
  lastSyncAt = Date.now();
  return true;
}

/* ---- unified load ---- */
async function loadState(){
  await loadSyncLink();
  if(syncURL){
    try{
      await loadFromSheet();
      syncMode = 'sheet';
      return;
    }catch(e){
      console.error('Sheet load failed, using local copy:',e);
      syncMode = 'local';
      await loadLocal();
      toast('Could not reach the shared sheet — using this device');
      return;
    }
  }
  syncMode = 'local';
  await loadLocal();
}

/* ---- unified save (debounced so rapid edits = one write) ---- */
function saveState(){
  /* always keep a local copy as a safety net */
  saveLocal();
  if(syncMode!=='sheet' || !syncURL) return;
  clearTimeout(saveTimer);
  setSyncBadge('saving');
  saveTimer = setTimeout(function(){
    saveToSheet().then(function(){
      setSyncBadge('synced');
    },function(e){
      console.error('Sheet save failed:',e);
      setSyncBadge('error');
      toast('Sync failed — saved on this device, will retry');
    });
  },700);
}

/* test a link without committing to it */
async function testSyncLink(url){
  var res = await fetch(url.trim(),{method:'GET'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  var json = await res.json();
  if(!(json && json.ok)) throw new Error('Unexpected response');
  return json.data||{};
}

/* ---------- HELPERS ---------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(ts){
  if(!ts) return '—';
  var d = new Date(ts);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateShort(ts){
  if(!ts) return '—';
  var d = new Date(ts);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }
function firstName(full){ return String(full||'').trim().split(/\s+/)[0]||'there'; }

function toast(msg){
  var t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------- DERIVED ---------- */
function companyById(id){
  for(var i=0;i<state.companies.length;i++)
    if(state.companies[i].id===id) return state.companies[i];
  return null;
}
function companyEmails(cid){
  return state.emails.filter(function(e){ return e.companyId===cid; });
}
function companyStage(c){
  if(c.outcome==='won') return 'won';
  if(c.outcome==='lost') return 'lost';
  var em = companyEmails(c.id);
  var hasInitial = em.some(function(e){return e.type==='initial';});
  var hasFollow  = em.some(function(e){return e.type==='followup';});
  if(hasFollow) return 'followup';
  if(hasInitial) return 'initial';
  return 'new';
}
/* returns reminder object or null */
function followUpReminder(c){
  if(c.outcome==='won'||c.outcome==='lost') return null;
  var em = companyEmails(c.id).filter(function(e){return e.type==='initial';});
  if(!em.length) return null;
  var hasFollow = companyEmails(c.id).some(function(e){return e.type==='followup';});
  if(hasFollow) return null;
  /* latest initial */
  var latest = em.reduce(function(a,b){return a.sentAt>b.sentAt?a:b;});
  var due = latest.sentAt + FOLLOWUP_DAYS*86400000;
  var now = Date.now();
  var daysLeft = daysBetween(now,due);
  return {
    companyId:c.id, companyName:c.name,
    initialAt:latest.sentAt, dueAt:due, daysLeft:daysLeft,
    overdue: now>=due
  };
}
function allReminders(){
  var r = [];
  state.companies.forEach(function(c){
    var rem = followUpReminder(c);
    if(rem) r.push(rem);
  });
  r.sort(function(a,b){return a.dueAt-b.dueAt;});
  return r;
}

function go(view, opts){
  opts = opts||{};
  state.view = view;
  if(opts.industry!==undefined) state.filterIndustry = opts.industry;
  if(opts.detailId!==undefined) state.detailId = opts.detailId;

  /* nav active states */
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.classList.remove('active');
  });
  if(view==='companies' && state.filterIndustry!=='all'){
    var ind = document.querySelector('[data-nav-industry="'+state.filterIndustry+'"]');
    if(ind) ind.classList.add('active');
  } else {
    var navBtn = document.querySelector('[data-nav="'+(view==='detail'?'companies':view)+'"]');
    if(navBtn) navBtn.classList.add('active');
  }

  /* pages */
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  var page = document.getElementById('page-'+view);
  if(page) page.classList.add('active');

  /* topbar + render */
  var titles = {
    dashboard:['Overview','Dashboard'],
    companies:['Directory','All Companies'],
    detail:['Company','Profile'],
    emaillog:['Activity','Email Log'],
    settings:['Account','Settings']
  };
  if(view==='companies' && state.filterIndustry!=='all'){
    document.getElementById('tbKicker').textContent = 'Industry';
    document.getElementById('tbTitle').textContent = state.filterIndustry+'s';
  } else {
    document.getElementById('tbKicker').textContent = titles[view][0];
    document.getElementById('tbTitle').textContent = titles[view][1];
  }

  if(view==='dashboard') renderDashboard();
  else if(view==='companies') renderCompanies();
  else if(view==='detail') renderDetail();
  else if(view==='emaillog') renderEmailLog();
  else if(view==='settings') renderSettings();

  document.querySelector('.main').scrollTop = 0;
}

/* ============================================================

   ============================================================ */
function renderDashboard(){
  var page = document.getElementById('page-dashboard');
  var totalCompanies = state.companies.length;
  var totalEmails = state.emails.length;
  var won = state.companies.filter(function(c){return c.outcome==='won';}).length;
  var lost = state.companies.filter(function(c){return c.outcome==='lost';}).length;
  var decided = won+lost;
  var winRate = decided? Math.round(won/decided*100) : 0;
  var reminders = allReminders();
  var dueNow = reminders.filter(function(r){return r.overdue;}).length;

  /* monthly email chart — last 6 months */
  var months = [];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({
      key: d.getFullYear()+'-'+d.getMonth(),
      label: d.toLocaleDateString('en-AU',{month:'short'}),
      initial:0, followup:0, closing:0
    });
  }
  state.emails.forEach(function(e){
    var d = new Date(e.sentAt);
    var k = d.getFullYear()+'-'+d.getMonth();
    var m = months.filter(function(x){return x.key===k;})[0];
    if(m){
      if(e.type==='initial') m.initial++;
      else if(e.type==='followup') m.followup++;
      else m.closing++;
    }
  });
  var maxBar = Math.max(1, Math.max.apply(null, months.map(function(m){
    return Math.max(m.initial+m.closing, m.followup);
  })));

  var chartHTML = months.map(function(m){
    var sent = m.initial+m.closing;
    var h1 = Math.round(sent/maxBar*140);
    var h2 = Math.round(m.followup/maxBar*140);
    return '<div class="chart-col">'+
      '<div class="chart-bars">'+
        '<div class="chart-bar" style="height:'+h1+'px">'+
          (sent?'<span class="bv">'+sent+'</span>':'')+
        '</div>'+
        '<div class="chart-bar fu" style="height:'+h2+'px">'+
          (m.followup?'<span class="bv">'+m.followup+'</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="chart-x">'+m.label+'</div>'+
    '</div>';
  }).join('');

  /* industry breakdown */
  var indCounts = INDUSTRIES.map(function(ind){
    return {name:ind, count:state.companies.filter(function(c){return c.industry===ind;}).length};
  });
  var maxInd = Math.max(1, Math.max.apply(null, indCounts.map(function(x){return x.count;})));
  var indHTML = indCounts.map(function(x){
    return '<div class="ind-item">'+
      '<div class="ind-name">'+esc(x.name)+'</div>'+
      '<div class="ind-track"><div class="ind-fill" style="width:'+(x.count/maxInd*100)+'%"></div></div>'+
      '<div class="ind-val">'+x.count+'</div>'+
    '</div>';
  }).join('');

  /* win/loss donut */
  var pending = totalCompanies - won - lost;
  var circ = 2*Math.PI*52;
  var wonLen = decided? (won/totalCompanies)*circ : 0;
  var lostLen = decided? (lost/totalCompanies)*circ : 0;
  var pendLen = totalCompanies? (pending/totalCompanies)*circ : circ;

  /* reminders list */
  var remHTML;
  if(!reminders.length){
    remHTML = '<div class="empty-mini">No follow-ups pending. Send an initial email to start the '+FOLLOWUP_DAYS+'-day timer.</div>';
  } else {
    remHTML = reminders.slice(0,6).map(function(r){
      var cls, badge, badgeCls;
      if(r.overdue){
        cls='due'; badgeCls='';
        badge = r.daysLeft<=-1? Math.abs(r.daysLeft)+'d overdue':'Due today';
      } else if(r.daysLeft<=2){
        cls='upcoming'; badgeCls='soon'; badge='in '+r.daysLeft+'d';
      } else {
        cls=''; badgeCls='later'; badge='in '+r.daysLeft+'d';
      }
      return '<div class="reminder '+cls+'" data-rem="'+r.companyId+'">'+
        '<div class="rem-icon">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+
        '</div>'+
        '<div class="rem-body">'+
          '<div class="rem-title">'+esc(r.companyName)+'</div>'+
          '<div class="rem-meta">Initial sent '+fmtDate(r.initialAt)+' — follow-up '+fmtDate(r.dueAt)+'</div>'+
        '</div>'+
        '<div class="rem-due '+badgeCls+'">'+badge+'</div>'+
      '</div>';
    }).join('');
  }

  page.innerHTML =
    '<div class="stat-row">'+
      '<div class="stat-card"><div class="stat-k">Companies</div>'+
        '<div class="stat-v">'+totalCompanies+'</div>'+
        '<div class="stat-meta">'+pending+' still in progress</div></div>'+
      '<div class="stat-card amber"><div class="stat-k">Emails Sent</div>'+
        '<div class="stat-v">'+totalEmails+'</div>'+
        '<div class="stat-meta">across all stages</div></div>'+
      '<div class="stat-card green"><div class="stat-k">Win Rate</div>'+
        '<div class="stat-v">'+winRate+'%</div>'+
        '<div class="stat-meta">'+won+' won · '+lost+' lost</div></div>'+
      '<div class="stat-card rust"><div class="stat-k">Follow-ups Due</div>'+
        '<div class="stat-v">'+dueNow+'</div>'+
        '<div class="stat-meta">'+reminders.length+' total scheduled</div></div>'+
    '</div>'+

    '<div class="dash-grid">'+
      '<div class="panel">'+
        '<div class="panel-head">'+
          '<div class="panel-title">Email Activity</div>'+
          '<div class="panel-tag">Last 6 Months</div>'+
        '</div>'+
        '<div class="chart">'+chartHTML+'</div>'+
        '<div class="chart-legend">'+
          '<div class="leg"><div class="leg-swatch" style="background:var(--brass)"></div>Initial &amp; Closing</div>'+
          '<div class="leg"><div class="leg-swatch" style="background:var(--ink-3)"></div>Follow-up</div>'+
        '</div>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-head">'+
          '<div class="panel-title">Win / Loss</div>'+
          '<div class="panel-tag">Pipeline</div>'+
        '</div>'+
        '<div class="donut-wrap">'+
          '<div class="donut">'+
            '<svg width="140" height="140" viewBox="0 0 140 140">'+
              '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--paper-3)" stroke-width="16"/>'+
              '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--green)" stroke-width="16" '+
                'stroke-dasharray="'+wonLen+' '+circ+'" stroke-dashoffset="0"/>'+
              '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--rust)" stroke-width="16" '+
                'stroke-dasharray="'+lostLen+' '+circ+'" stroke-dashoffset="'+(-wonLen)+'"/>'+
            '</svg>'+
            '<div class="donut-center">'+
              '<div class="donut-pct">'+winRate+'%</div>'+
              '<div class="donut-lbl">Win Rate</div>'+
            '</div>'+
          '</div>'+
          '<div class="wl-rows">'+
            '<div class="wl-row"><div class="wl-dot" style="background:var(--green)"></div>'+
              '<div class="wl-name">Won</div><div class="wl-val">'+won+'</div></div>'+
            '<div class="wl-row"><div class="wl-dot" style="background:var(--rust)"></div>'+
              '<div class="wl-name">Lost</div><div class="wl-val">'+lost+'</div></div>'+
            '<div class="wl-row"><div class="wl-dot" style="background:var(--paper-3)"></div>'+
              '<div class="wl-name">In Progress</div><div class="wl-val">'+pending+'</div></div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+

    '<div class="dash-grid">'+
      '<div class="panel">'+
        '<div class="panel-head">'+
          '<div class="panel-title">Follow-up Reminders</div>'+
          '<div class="panel-tag">'+FOLLOWUP_DAYS+'-Day Rule</div>'+
        '</div>'+
        '<div class="reminder-list">'+remHTML+'</div>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-head">'+
          '<div class="panel-title">By Industry</div>'+
          '<div class="panel-tag">Directory</div>'+
        '</div>'+
        '<div class="ind-list">'+indHTML+'</div>'+
      '</div>'+
    '</div>';

  page.querySelectorAll('[data-rem]').forEach(function(el){
    el.style.cursor='pointer';
    el.addEventListener('click',function(){
      go('detail',{detailId:el.getAttribute('data-rem')});
    });
  });
}

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'+
          'Delete</button>'+
      '</div>'+
    '</div>'+
    '<div class="detail-sub">'+
      '<span class="stage-tag" style="background:var(--ink);color:var(--brass-lt);padding:4px 10px;border-radius:10px;">'+st.label+'</span>'+
      (c.website?'<a href="'+esc(c.website.indexOf('http')===0?c.website:'https://'+c.website)+'" target="_blank">'+esc(c.website)+' ↗</a>':'')+
    '</div>'+

    remBanner+

    '<div class="detail-cols">'+
      '<div>'+
        '<div class="panel" style="margin-bottom:16px;">'+
          '<div class="panel-head"><div class="panel-title">Company Details</div></div>'+
          '<div class="field-grid">'+
            '<div class="field"><div class="field-label">Industry</div>'+
              '<div class="field-value">'+esc(c.industry||'—')+'</div></div>'+
            '<div class="field"><div class="field-label">Website</div>'+
              '<div class="field-value'+(c.website?'':' muted')+'">'+esc(c.website||'Not provided')+'</div></div>'+

              '<div class="field-value'+(c.notes?'':' muted')+'" style="white-space:pre-wrap;">'+esc(c.notes||'No notes')+'</div></div>'+
          '</div>'+
        '</div>'+
        '<div class="panel">'+
          '<div class="panel-head"><div class="panel-title">Contacts</div>'+

          '<div class="email-actions">'+
            emailBtnHTML('initial','1','Initial Email',sent.initial,false)+
            emailBtnHTML('followup','2','Follow-up Email',sent.followup,!sent.initial)+

  });
  document.getElementById('deleteCompanyBtn').addEventListener('click',function(){

function emailBtnHTML(type,num,label,sent,disabled){

      '<div class="eb-meta">'+

    (sent?'<div class="eb-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg></div>':'')+

}

/* ============================================================
   RENDER — EMAIL LOG
   ============================================================ */
function renderEmailLog(){
  var page = document.getElementById('page-emaillog');
  var emails = state.emails.slice().sort(function(a,b){return b.sentAt-a.sentAt;});

  if(!emails.length){
    page.innerHTML = emptyState(
      'No emails logged',
      'Every email you send through a company profile is recorded here automatically.',
      'View Companies','viewCompanies');
    var b = page.querySelector('[data-empty-action]');
    if(b) b.addEventListener('click',function(){go('companies');});
    return;
  }

  var rows = emails.map(function(e){
    var c = companyById(e.companyId);
    var tlabel = {initial:'Initial',followup:'Follow-up',closing:'Closing'}[e.type];
    return '<tr data-log-company="'+e.companyId+'" style="cursor:pointer;">'+
      '<td><span class="log-type">'+tlabel+'</span></td>'+
      '<td style="font-weight:500;color:var(--ink);">'+esc(c?c.name:'(deleted)')+'</td>'+
      '<td>'+esc(e.contactName||'—')+'</td>'+
      '<td style="color:var(--text-mut);">'+esc(e.subject||'')+'</td>'+
      '<td>'+esc(USERS[e.sentBy]?USERS[e.sentBy].name:e.sentBy)+'</td>'+
      '<td class="mono" style="color:var(--text-mut);">'+fmtDate(e.sentAt)+'</td>'+
    '</tr>';
  }).join('');

  page.innerHTML =
    '<div class="panel">'+
      '<div class="panel-head">'+
        '<div class="panel-title">All Logged Emails</div>'+
        '<div class="panel-tag">'+emails.length+' Total</div>'+
      '</div>'+
      '<div style="overflow-x:auto;">'+
        '<table class="log-table">'+
          '<thead><tr><th>Type</th><th>Company</th><th>Contact</th><th>Subject</th><th>Sent By</th><th>Date</th></tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table>'+
      '</div>'+
    '</div>';

  page.querySelectorAll('[data-log-company]').forEach(function(tr){
    tr.addEventListener('click',function(){
      var cid = tr.getAttribute('data-log-company');
      if(companyById(cid)) go('detail',{detailId:cid});
    });
  });
}

/* ============================================================
   RENDER — SETTINGS
   ============================================================ */
function renderSettings(){
  var page = document.getElementById('page-settings');
  var u = state.currentUser;

  page.innerHTML =
    '<div class="panel settings-card" style="margin-bottom:18px;">'+
      '<div class="panel-head"><div class="panel-title">Shared Sync</div>'+
        '<div class="panel-tag">'+(syncMode==='sheet'?'Connected':'Not Connected')+'</div></div>'+
      '<p style="font-size:12px;color:var(--text-mut);margin-bottom:14px;line-height:1.6;">'+
        'Paste the Google Sheet connection link here so you and Adrian share one live '+
        'client list. Both of you enter the <strong>same link</strong>. See the setup '+
        'guide for how to create it.</p>'+
      '<div style="display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:3px;'+
        'margin-bottom:14px;background:var(--paper-2);border-left:3px solid '+
        (syncMode==='sheet'?'var(--green)':'var(--text-faint)')+';">'+
        '<span style="width:9px;height:9px;border-radius:50%;background:'+
          (syncMode==='sheet'?'var(--green)':'var(--text-faint)')+';"></span>'+
        '<span style="font-size:12px;color:var(--text);">'+
          (syncMode==='sheet'
            ? 'Connected — your data is shared live.'
            : 'Not connected — data is saved on this device only.')+
        '</span>'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Google Sheet Connection Link</label>'+
        '<input type="text" id="syncInput" value="'+esc(syncURL)+'" '+
          'placeholder="https://script.google.com/macros/s/..../exec">'+
      '</div>'+
      '<div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;">'+
        '<button class="btn btn-primary" id="connectSyncBtn">Test &amp; Connect</button>'+
        (syncMode==='sheet'
          ? '<button class="btn btn-ghost" id="pushSyncBtn">Push This Device\u2019s Data</button>'+
            '<button class="btn btn-ghost" id="disconnectSyncBtn">Disconnect</button>'
          : '')+
      '</div>'+
      '<div id="syncMsg" style="font-size:11px;margin-top:11px;color:var(--text-mut);"></div>'+
    '</div>'+

    '<div class="panel settings-card" style="margin-bottom:18px;">'+
      '<div class="panel-head"><div class="panel-title">Sender Details</div>'+
        '<div class="panel-tag">'+esc(USERS[u].name)+'</div></div>'+
      '<p style="font-size:12px;color:var(--text-mut);margin-bottom:14px;line-height:1.6;">'+
        'These details appear in the signature of every email you send. '+
        'Whoever is signed in, their details are used automatically — Christopher and '+
        'Adrian each send under their own name.</p>'+
      '<div class="field-grid">'+
        senderField('Name', EmailEngine.SENDERS[u].name)+
        senderField('Title', EmailEngine.SENDERS[u].title)+
        senderField('Email', EmailEngine.SENDERS[u].email)+
        senderField('Phone', EmailEngine.SENDERS[u].phoneDisplay)+
      '</div>'+
      '<div class="compose-hint" style="margin-top:14px;">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'+
        '<div>To change these, they need to be edited in the email engine — let your '+
        'developer know and they can update them in one place.</div>'+
      '</div>'+
    '</div>'+

    '<div class="panel settings-card">'+
      '<div class="panel-head"><div class="panel-title">Email Templates</div>'+
        '<div class="panel-tag">18 Approved</div></div>'+
      '<p style="font-size:12px;color:var(--text-mut);margin-bottom:14px;line-height:1.6;">'+
        'Each email button uses a pre-approved, professionally designed template. '+
        'The right one is chosen automatically from the company\u2019s industry and the '+
        'contact\u2019s name is filled in for you. There are six industry versions of each:</p>'+
      '<div style="display:flex;flex-direction:column;gap:10px;">'+
        templateRow('Initial Email','Sent as the first cold approach. Six industry versions.')+
        templateRow('Follow-up Email','Sent '+FOLLOWUP_DAYS+' days after the initial, if no reply. Six versions.')+
        templateRow('Closing Email','A graceful final note. Six versions.')+
      '</div>'+
      '<div class="compose-hint" style="margin-top:14px;">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'+
        '<div>You preview the exact email before sending. To change the wording of a '+
        'template, it must be updated in the email engine — these are fixed in the app '+
        'so outreach stays consistent and approved.</div>'+
      '</div>'+
    '</div>';

  /* ---- sync controls ---- */
  var syncMsg = document.getElementById('syncMsg');
  function setMsg(text,color){
    syncMsg.textContent = text;
    syncMsg.style.color = color||'var(--text-mut)';
  }
  document.getElementById('connectSyncBtn').addEventListener('click',function(){
    var url = document.getElementById('syncInput').value.trim();
    if(!url){ setMsg('Paste your connection link first.','var(--rust)'); return; }
    if(url.indexOf('https://script.google.com/')!==0){
      setMsg('That doesn\u2019t look like a Google Apps Script link. It should start with https://script.google.com/','var(--rust)');
      return;
    }
    setMsg('Testing connection…','var(--amber)');
    testSyncLink(url).then(function(remoteData){
      var remoteCount = (remoteData.companies||[]).length;
      var localCount = state.companies.length;
      var proceed = true;
      if(remoteCount>0 && localCount>0){
        proceed = confirm(
          'The shared sheet already has '+remoteCount+' company record(s).\n\n'+
          'Click OK to use the SHARED data (recommended — this is the team list).\n'+
          'Click Cancel to stop and instead push this device\u2019s '+localCount+' record(s) up.');
      }
      saveSyncLink(url).then(function(){
        if(proceed){
          /* adopt the shared data */
          applyData(remoteData);
          syncMode='sheet';
          if(remoteCount===0){ saveToSheet(); } /* seed empty sheet with our data */
          setSyncBadge('synced');
          renderSidebarCounts();
          setMsg('Connected. You\u2019re now on the shared list.','var(--green)');
          toast('Connected to shared sheet');
          renderSettings();
        } else {
          /* keep local data, push it up */
          syncMode='sheet';
          saveToSheet().then(function(){
            setSyncBadge('synced');
            setMsg('Connected — this device\u2019s data was pushed to the shared sheet.','var(--green)');
            toast('Data pushed to shared sheet');
            renderSettings();
          });
        }
      });
    },function(e){
      console.error(e);
      setMsg('Couldn\u2019t connect. Check the link is the /exec web-app URL and that it\u2019s deployed with access set to "Anyone".','var(--rust)');
    });
  });
  var pushBtn = document.getElementById('pushSyncBtn');
  if(pushBtn){
    pushBtn.addEventListener('click',function(){
      if(!confirm('This overwrites the shared sheet with the data currently on THIS device. Continue?')) return;
      setMsg('Pushing…','var(--amber)');
      saveToSheet().then(function(){
        setMsg('Shared sheet updated from this device.','var(--green)');
        toast('Pushed to shared sheet');
      },function(){ setMsg('Push failed — try again.','var(--rust)'); });
    });
  }
  var disBtn = document.getElementById('disconnectSyncBtn');
  if(disBtn){
    disBtn.addEventListener('click',function(){
      if(!confirm('Disconnect from the shared sheet? This device will switch to local-only storage. The shared sheet itself is not deleted.')) return;
      saveSyncLink('').then(function(){
        syncMode='local';
        setSyncBadge('local');
        renderSettings();
        toast('Disconnected — local only');
      });
    });
  }
}

var editingCompanyId = null;
var modalContactCount = 0;

function openCompanyModal(id){
  editingCompanyId = id||null;
  var c = id? companyById(id) : null;
  document.getElementById('companyModalTitle').textContent = c?'Edit Company':'New Company';

  var body = document.getElementById('companyModalBody');
  body.innerHTML =
    '<div class="form-grid">'+
      '<div class="form-field full">'+
        '<label>Company Name *</label>'+
        '<input type="text" id="f-name" value="'+esc(c?c.name:'')+'" placeholder="e.g. The Crown Hotel">'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Industry *</label>'+
        '<select id="f-industry">'+
          INDUSTRIES.map(function(ind){
            return '<option value="'+esc(ind)+'"'+(c&&c.industry===ind?' selected':'')+'>'+esc(ind)+'</option>';
          }).join('')+
        '</select>'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Website</label>'+
        '<input type="text" id="f-website" value="'+esc(c?c.website||'':'')+'" placeholder="www.example.com.au">'+
      '</div>'+
      '<div class="form-field full">'+
        '<label>Address</label>'+
        '<input type="text" id="f-address" value="'+esc(c?c.address||'':'')+'" placeholder="Street, suburb, state">'+
      '</div>'+
      '<div class="form-field full">'+
        '<label>Notes</label>'+
        '<textarea id="f-notes" placeholder="Anything useful — best time to call, prior jobs, who referred them…">'+esc(c?c.notes||'':'')+'</textarea>'+
      '</div>'+
      '<div class="form-divider"><span>Contacts</span><div class="fd-line"></div></div>'+
    '</div>'+
    '<div id="contactsWrap" style="margin-top:14px;"></div>'+
    '<button class="add-contact-btn" id="addContactBtn">+ Add Another Contact</button>';

  var wrap = body.querySelector('#contactsWrap');
  modalContactCount = 0;
  var existing = (c&&c.contacts&&c.contacts.length)? c.contacts : [null];
  existing.forEach(function(ct){ wrap.insertAdjacentHTML('beforeend', contactBlockHTML(ct)); });
  bindContactRemovers(wrap);

  body.querySelector('#addContactBtn').addEventListener('click',function(){
    wrap.insertAdjacentHTML('beforeend', contactBlockHTML(null));
    bindContactRemovers(wrap);
  });

  openModal('companyModal');
  setTimeout(function(){ document.getElementById('f-name').focus(); },100);

        '<input type="text" data-c-field="name" value="'+esc(ct?ct.name||'':'')+'" placeholder="Full name">'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Position</label>'+
        '<input type="text" data-c-field="position" value="'+esc(ct?ct.position||'':'')+'" placeholder="e.g. Venue Manager">'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Email</label>'+
        '<input type="email" data-c-field="email" value="'+esc(ct?ct.email||'':'')+'" placeholder="name@example.com">'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Mobile</label>'+
        '<input type="tel" data-c-field="mobile" value="'+esc(ct?ct.mobile||'':'')+'" placeholder="04xx xxx xxx">'+
      '</div>'+
      '<div class="form-field">'+
        '<label>Landline</label>'+
        '<input type="tel" data-c-field="landline" value="'+esc(ct?ct.landline||'':'')+'" placeholder="(0x) xxxx xxxx">'+
      '</div>'+
    '</div>'+
  '</div>';
}
function bindContactRemovers(wrap){
  wrap.querySelectorAll('[data-remove-contact]').forEach(function(btn){
    btn.onclick = function(){
      var i = btn.getAttribute('data-remove-contact');
      var blk = wrap.querySelector('[data-contact-block="'+i+'"]');
      if(blk) blk.remove();
    };
  });
}

function saveCompany(){
  var name = document.getElementById('f-name').value.trim();
  if(!name){ toast('Company name is required'); document.getElementById('f-name').focus(); return; }

  var contacts = [];
  document.querySelectorAll('[data-contact-block]').forEach(function(blk){
    var ct = {};
    blk.querySelectorAll('[data-c-field]').forEach(function(inp){
      ct[inp.getAttribute('data-c-field')] = inp.value.trim();
    });
    if(ct.name||ct.email||ct.mobile||ct.landline) contacts.push(ct);
  });

  var data = {
    name: name,
    industry: document.getElementById('f-industry').value,
    website: document.getElementById('f-website').value.trim(),
    address: document.getElementById('f-address').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    contacts: contacts
  };

  if(editingCompanyId){
    var c = companyById(editingCompanyId);
    for(var k in data) c[k] = data[k];
    toast('Company updated');
  } else {
    data.id = uid();
    data.createdAt = Date.now();
    data.outcome = null;
    state.companies.push(data);
    toast('Company added');
  }
  saveState();
  closeModal('companyModal');
  renderSidebarCounts();
  if(editingCompanyId) go('detail',{detailId:editingCompanyId});
  else go('companies');
}

/* ============================================================
   COMPOSE / SEND EMAIL
   ============================================================ */
var composeContext = null;

/* maps CRM industry -> engine. Engine handles all six. */
function openComposeModal(companyId, type){
  var c = companyById(companyId);
  if(!c){ return; }
  var contacts = c.contacts||[];
  var primary = contacts[0];
  if(!primary || !primary.email){
    toast('Add a contact with an email address first');
    return;
  }

  var u = state.currentUser;          /* 'chris' | 'adrian' */
  var industry = c.industry || 'Office';

  composeContext = {
    companyId: companyId, type: type, industry: industry,
    to: primary.email, contactName: primary.name,
    contactIndex: 0
  };

  var typeLabels = {initial:'Initial Email',followup:'Follow-up Email',closing:'Closing Email'};
  document.getElementById('composeModalTitle').textContent =
    typeLabels[type]+' — '+industry;

  /* contact picker if multiple */
  var contactPicker;
  if(contacts.length>1){
    contactPicker = '<div class="compose-row">'+
      '<div class="cr-label">To</div>'+
      '<select id="composeContact" class="compose-subject-input" style="padding:6px 10px;">'+
        contacts.map(function(ct,i){
          return '<option value="'+i+'"'+(i===0?' selected':'')+(ct.email?'':' disabled')+'>'+
            esc(ct.name)+(ct.email?' — '+esc(ct.email):' (no email)')+'</option>';
        }).join('')+
      '</select>'+
    '</div>';
  } else {
    contactPicker = '<div class="compose-row"><div class="cr-label">To</div>'+
      '<div class="cr-value">'+esc(primary.name)+' — '+esc(primary.email)+'</div></div>';
  }

  var senderInfo = EmailEngine.SENDERS[u] || EmailEngine.SENDERS.chris;

  document.getElementById('composeModalBody').innerHTML =
    '<div class="compose-meta">'+
      contactPicker+
      '<div class="compose-row"><div class="cr-label">From</div>'+
        '<div class="cr-value">'+esc(senderInfo.name)+' — '+esc(senderInfo.email)+'</div></div>'+
      '<div class="compose-row"><div class="cr-label">Industry</div>'+
        '<div class="cr-value">'+esc(industry)+' template (chosen automatically)</div></div>'+
    '</div>'+
    '<div class="form-field" style="margin-bottom:14px;">'+
      '<label>Subject</label>'+
      '<input type="text" id="composeSubject" class="compose-subject-input">'+
    '</div>'+
    '<div class="form-field">'+
      '<label>Email preview — this designed email will be sent</label>'+
      '<div id="composePreview" style="border:1px solid var(--line);border-radius:3px;'+
        'background:#faf8f4;height:340px;overflow-y:auto;"></div>'+
    '</div>'+
    '<div class="compose-hint">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'+
      '<div>This sends the designed HTML email through Brevo, from your address. '+
      'It logs the email and '+(type==='initial'?'starts the '+FOLLOWUP_DAYS+'-day follow-up reminder.':'updates this company\'s stage.')+
      ' The body follows the approved '+esc(industry)+' template and is not edited here — only the subject can be changed.</div>'+
    '</div>';

  renderComposePreview();

  var picker = document.getElementById('composeContact');
  if(picker){
    picker.addEventListener('change',function(){
      var idx = parseInt(picker.value,10);
      var ct = contacts[idx];
      composeContext.to = ct.email;
      composeContext.contactName = ct.name;
      composeContext.contactIndex = idx;
      renderComposePreview();
    });
  }

  openModal('composeModal');
}

/* builds the email from the engine and shows it in the preview */
function renderComposePreview(){
  if(!composeContext) return;
  var u = state.currentUser;
  var built = EmailEngine.buildEmail(
    composeContext.industry, composeContext.type,
    { sender:u, contactName:composeContext.contactName,
      companyName: (companyById(composeContext.companyId)||{}).name }
  );
  composeContext.builtHtml = built.html;
  composeContext.fromEmail = built.fromEmail;
  composeContext.fromName  = built.fromName;
  composeContext.replyTo   = built.replyTo;

  var subjEl = document.getElementById('composeSubject');
  if(subjEl && !subjEl.value) subjEl.value = built.subject;
  composeContext.defaultSubject = built.subject;

  var prev = document.getElementById('composePreview');
  if(prev){
    /* render inside an iframe so email styles don't leak into the app */
    prev.innerHTML = '<iframe style="width:100%;height:100%;border:0;" '+
      'sandbox="allow-same-origin"></iframe>';
    var ifr = prev.querySelector('iframe');
    var doc = ifr.contentDocument || ifr.contentWindow.document;
    doc.open(); doc.write(built.html); doc.close();
  }
}

/* sends through the Apps Script -> Brevo, then logs */
function sendComposedEmail(){
  if(!composeContext) return;
  var subject = (document.getElementById('composeSubject').value||'').trim()
                || composeContext.defaultSubject;
  var html = composeContext.builtHtml;

  if(syncMode!=='sheet' || !syncURL){
    toast('Connect to the shared sheet first (Settings) — sending needs it');
    return;
  }
  if(!html){ toast('Email not ready — reopen and try again'); return; }

  var btn = document.getElementById('sendEmailBtn');
  var prevLabel = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = 'Sending…'; }

  var payload = {
    action:'sendEmail',
    to: composeContext.to,
    toName: composeContext.contactName,
    subject: subject,
    html: html,
    fromEmail: composeContext.fromEmail,
    fromName: composeContext.fromName,
    replyTo: composeContext.replyTo
  };

  fetch(syncURL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  }).then(function(res){
    return res.json();
  }).then(function(json){
    if(json && json.ok){
      /* log the sent email */
      state.emails.push({
        id: uid(),
        companyId: composeContext.companyId,
        type: composeContext.type,
        to: composeContext.to,
        contactName: composeContext.contactName,
        subject: subject,
        sentBy: state.currentUser,
        sentAt: Date.now(),
        method: 'brevo'
      });
      saveState();
      renderSidebarCounts();
      toast('Email sent & logged');
      closeModal('composeModal');
      composeContext = null;
      if(state.view==='detail') renderDetail();
    } else {
      var err = (json && json.error) ? json.error : 'Unknown error';
      toast('Send failed: '+err);
      if(btn){ btn.disabled=false; btn.innerHTML=prevLabel; }
    }
  }).catch(function(e){
    console.error('Send error',e);
    toast('Send failed — check connection and try again');
    if(btn){ btn.disabled=false; btn.innerHTML=prevLabel; }
  });
}

/* logs the email WITHOUT sending — for when sent manually elsewhere */
function logWithoutSending(){
  if(!composeContext) return;
  var subject = (document.getElementById('composeSubject').value||'').trim()
                || composeContext.defaultSubject;
  state.emails.push({
    id: uid(),
    companyId: composeContext.companyId,
    type: composeContext.type,
    to: composeContext.to,
    contactName: composeContext.contactName,
    subject: subject,
    sentBy: state.currentUser,
    sentAt: Date.now(),
    method: 'manual'
  });
  saveState();
  renderSidebarCounts();
  toast('Logged as sent (no email sent)');
  closeModal('composeModal');
  composeContext = null;
  if(state.view==='detail') renderDetail();
}
/* ============================================================
   MODAL HELPERS
   ============================================================ */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ============================================================
   GLOBAL EVENT WIRING
   ============================================================ */
function wireGlobal(){
  /* sidebar nav */
  document.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.addEventListener('click',function(){
      go(btn.getAttribute('data-nav'),{industry:'all'});
    });
  });
  /* logout */
  document.getElementById('logoutBtn').addEventListener('click',function(){
    state.currentUser = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'flex';
  });
  /* add company */
  document.getElementById('addCompanyBtn').addEventListener('click',function(){
    openCompanyModal();
  });
  /* save company */
  document.getElementById('saveCompanyBtn').addEventListener('click', saveCompany);
  /* search */
  var search = document.getElementById('globalSearch');
  search.addEventListener('input',function(){
    state.search = search.value.trim();
    if(state.view!=='companies') go('companies',{industry:'all'});
    else renderCompanies();
  });
  /* compose buttons */
  document.getElementById('sendEmailBtn').addEventListener('click', sendComposedEmail);
  document.getElementById('logOnlyBtn').addEventListener('click', logWithoutSending);
  /* refresh — pull latest shared data */
  document.getElementById('refreshBtn').addEventListener('click',function(){
    if(syncMode!=='sheet'){
      toast('Not connected to a shared sheet — see Settings');
      return;
    }
    setSyncBadge('saving');
    loadFromSheet().then(function(){
      setSyncBadge('synced');
      renderSidebarCounts();
      go(state.view,{industry:state.filterIndustry,detailId:state.detailId});
      toast('Refreshed from shared sheet');
    },function(){
      setSyncBadge('error');
      toast('Couldn\u2019t refresh — check your connection');
    });
  });
  /* modal close */
  document.querySelectorAll('[data-close-modal]').forEach(function(btn){
    btn.addEventListener('click',function(){
      closeModal(btn.getAttribute('data-close-modal'));
    });
  });
  document.querySelectorAll('.modal-veil').forEach(function(veil){
    veil.addEventListener('click',function(e){
      if(e.target===veil) closeModal(veil.id);
    });
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      document.querySelectorAll('.modal-veil.open').forEach(function(m){
        m.classList.remove('open');
      });
    }
  });
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  renderLogin();
  wireGlobal();
  await loadState();
  setSyncBadge(syncMode==='sheet'?'synced':'local');
  renderSidebarCounts();
}
boot();

})();
